<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="ccLogoTitle">
  <title id="ccLogoTitle">Chalk &amp; Cover logo</title>
  <defs>
    <linearGradient id="ccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D52"/>
      <stop offset="100%" stop-color="#D9431A"/>
    </linearGradient>
    <filter id="ccShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2A1B14" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base emblem badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ccGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Open Book representation -->
  <g fill="#FFF8F3" filter="url(#ccShadow)">
    <path d="M32 20.5C27.2 17.5 21 17.2 15 18.5V40C21 38.7 27.2 39 32 42C36.8 39 43 38.7 49 40V18.5C43 17.2 36.8 17.5 32 20.5Z"/>
  </g>

  <!-- Book spine divider -->
  <path d="M32 20.5V42" fill="none" stroke="#D9431A" stroke-width="2" stroke-linecap="round"/>

  <!-- Book lines -->
  <g fill="none" stroke="#E66A45" stroke-width="1.4" stroke-linecap="round">
    <path d="M19 24.5C23 23.8 27 24.5 29.5 26"/>
    <path d="M19 29C23 28.3 27 29 29.5 30.5"/>
    <path d="M19 33.5C23 32.8 27 33.5 29.5 35"/>
    
    <path d="M45 24.5C41 23.8 37 24.5 34.5 26"/>
    <path d="M45 29C41 28.3 37 29 34.5 30.5"/>
    <path d="M45 33.5C41 32.8 37 33.5 34.5 35"/>
  </g>

  <!-- Stylized Pencil / Chalk Accent -->
  <g transform="translate(36, 10) rotate(35)">
    <rect x="0" y="0" width="7" height="24" rx="2" fill="#FFF8F3" stroke="#2A1B14" stroke-width="0.8"/>
    <rect x="0" y="0" width="7" height="6" rx="1.5" fill="#2A1B14"/>
    <path d="M0 24 L3.5 30 L7 24 Z" fill="#F2B24A" stroke="#2A1B14" stroke-width="0.6"/>
    <path d="M2 24 L3.5 28 L5 24 Z" fill="#2A1B14"/>
  </g>
</svg>
