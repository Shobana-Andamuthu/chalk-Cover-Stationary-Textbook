<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="ccBrandLogoTitle">
  <title id="ccBrandLogoTitle">Chalk &amp; Cover Professional Brand Logo</title>
  <defs>
    <!-- Premium Gradient Background -->
    <linearGradient id="ccBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7547"/>
      <stop offset="50%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#C83610"/>
    </linearGradient>

    <!-- Subtle Golden Accent Gradient -->
    <linearGradient id="ccGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Vector Depth -->
    <filter id="ccEmblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A0A04" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Base Badge Container -->
  <rect x="3" y="3" width="74" height="74" rx="22" fill="url(#ccBgGrad)"/>
  <rect x="3" y="3" width="74" height="74" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.8"/>

  <!-- Main Symbol Group (Open Book + Fountain Pen Nib) -->
  <g filter="url(#ccEmblemShadow)">
    <!-- Open Book Pages (Left & Right Symmetric Wings) -->
    <path d="M40 25C33.5 20.8 24.8 20.5 16 22.2V54.5C24.8 52.8 33.5 53.2 40 57.5C46.5 53.2 55.2 52.8 64 54.5V22.2C55.2 20.5 46.5 20.8 40 25Z" fill="#FFFDF9"/>
    
    <!-- Inner Spine Divider -->
    <path d="M40 25V57.5" fill="none" stroke="#C83610" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Left Page Accent Lines -->
    <path d="M22 29.5C27 28.8 32 29.8 35.5 31.8" stroke="#E65100" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M22 36.5C27 35.8 32 36.8 35.5 38.8" stroke="#E65100" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M22 43.5C27 42.8 32 43.8 35.5 45.8" stroke="#E65100" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Right Page Accent Lines -->
    <path d="M58 29.5C53 28.8 48 29.8 44.5 31.8" stroke="#E65100" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M58 36.5C53 35.8 48 36.8 44.5 38.8" stroke="#E65100" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M58 43.5C53 42.8 48 43.8 44.5 45.8" stroke="#E65100" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Gold Crest / Star Accent on Top Spine -->
    <path d="M40 13.5 L42.2 18.2 L47.4 18.7 L43.5 22.2 L44.7 27.3 L40 24.6 L35.3 27.3 L36.5 22.2 L32.6 18.7 L37.8 18.2 Z" fill="url(#ccGoldGrad)"/>
  </g>
</svg>
