<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Login | Chalk &amp; Cover</title><link href="assets/img/logo.svg" rel="icon" type="image/svg+xml"/><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="css/style.css" rel="stylesheet"/></head><body><main class="auth-page"><section class="auth-visual">
<div class="auth-top-nav">
  <a aria-label="Go to Home" class="auth-image-home-btn" href="index.html">
    <img src="assets/img/logo.svg" alt="Chalk &amp; Cover logo" width="20" height="20"/>
    Chalk &amp; Cover
  </a>
  <div class="auth-top-actions">
    <button aria-label="Switch to right-to-left layout" aria-pressed="false" class="nav-icon-btn dir-toggle-btn" type="button" title="Toggle LTR / RTL direction">
      <svg aria-hidden="true" class="icon-svg dir-toggle-icon" height="16" viewbox="0 0 24 24" width="16"><path d="M4 7h12"></path><path d="M13 3l4 4-4 4"></path><path d="M20 17H8"></path><path d="M11 13l-4 4 4 4"></path></svg>
      <span class="dir-toggle-label">LTR</span>
    </button>
    <button aria-label="Switch to dark mode" aria-pressed="false" class="nav-icon-btn theme-toggle-btn" type="button" title="Toggle dark / light mode">
      <svg class="icon-svg theme-icon-sun" height="16" viewbox="0 0 24 24" width="16"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg class="icon-svg theme-icon-moon" height="16" viewbox="0 0 24 24" width="16"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path></svg>
      <span>Dark Mode</span>
    </button>
  </div>
</div>
<img alt="School stationery and supplies" src="assets/img/auth-login.jpg"/><div class="auth-visual-copy"><p class="eyebrow">Welcome back</p><h1>Your school list, one easy place.</h1><p>Sign in to keep your wishlist, orders and school supplies together.</p></div></section><section class="auth-form-side"><div class="auth-form-wrap"><p class="eyebrow">Account access</p><h1>Login</h1><p class="subtext">Sign in to continue shopping with Chalk &amp; Cover.</p><form class="auth-form" id="loginForm"><div class="auth-field"><label for="loginEmail">Email address</label><input autocomplete="email" id="loginEmail" placeholder="you@example.com" required="" type="email"/></div><div class="auth-field"><label for="loginPassword">Password</label><input autocomplete="current-password" id="loginPassword" placeholder="Enter your password" required="" type="password"/></div><div class="auth-row"><label><input type="checkbox"/> Remember me</label><a href="#">Forgot password?</a></div><button class="btn-brand auth-submit" type="submit">Login</button></form><div class="auth-success" id="loginSuccess">Login successful — welcome back!</div><div class="auth-switch">New here? <a href="register.html">Create an account</a></div></div></section></main><script src="js/main.js"></script>
<script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();localStorage.setItem('chalkCoverAuth','1');document.getElementById('loginSuccess').classList.add('show');const next=localStorage.getItem('chalkCoverReturnTo')||'index.html';localStorage.removeItem('chalkCoverReturnTo');setTimeout(()=>window.location.href=next,350);});</script></body></html>
